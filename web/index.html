<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autonomy Atlas</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <header>
        <h1>Autonomy Atlas</h1>
        <p class="sub">Does each European country grow enough food for its own people?</p>
      </header>

      <label>
        Food
        <select id="group"></select>
      </label>

      <div class="mode" role="group" aria-label="View">
        <button type="button" data-mode="simple" aria-pressed="true">Simple</button>
        <button type="button" data-mode="expert" aria-pressed="false">Expert</button>
      </div>

      <label class="check">
        <input type="checkbox" id="bloc" />
        Count the EU as one country
      </label>

      <div id="expert-controls" hidden>
        <label>
          Indicator
          <select id="indicator">
            <option value="ssr">Self-sufficiency ratio (SSR)</option>
            <option value="idr">Import dependency ratio (IDR)</option>
          </select>
        </label>

        <label>
          Basis
          <select id="basis">
            <option value="tonnes">Tonnes</option>
            <option value="kcal">Calories</option>
          </select>
        </label>
      </div>

      <div id="legend"></div>

      <section id="detail">
        <p class="hint">Hover a country for details. Click to pin.</p>
      </section>

      <footer>
        <h3>Sources</h3>
        <ul id="sources"></ul>
        <p id="meta"></p>
      </footer>
    </aside>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
