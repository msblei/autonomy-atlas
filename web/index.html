<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autonomy Atlas</title>
    <meta name="description" content="How long would the food from a country's own farms last its people?" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <header>
        <p class="brand">Autonomy Atlas</p>
        <h1>Could your country feed itself?</h1>
        <label class="pick">
          <span>Country</span>
          <select id="country"><option value="">Loading…</option></select>
        </label>
      </header>

      <nav id="crumbs" aria-label="Where you are"></nav>
      <section id="view" aria-live="polite"></section>
      <footer id="foot"></footer>
    </aside>

    <div id="legend" aria-label="Map key"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
