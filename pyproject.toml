[project]
name = "autonomy-atlas"
version = "0.1.0"
description = "Interactive map of European agriculture: production, seasons, trade and self-sufficiency."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "requests>=2.32",
    "pyyaml>=6",
    "tqdm>=4.66",
    "h5py>=3.10",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "shapely>=2.0"]
dev = ["pytest>=8", "ruff>=0.5", "openpyxl>=3.1"]

[project.scripts]
atlas = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["mappings/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
