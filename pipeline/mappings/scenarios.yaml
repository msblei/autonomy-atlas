# "What if …?" scenarios: a group of countries stops selling food, and nothing takes its place
# (methodology, "Scenarios: what if some countries stopped selling"). `sellers` are ISO3 codes,
# or one of the rules `eu27` (the 27 EU members; the EU as one counts as a seller too) and
# `outside_europe` (every country not in countries.yaml). A seller gets no figure. `label` is the
# menu's one line; `food` the food the map switches to (products.yaml key, or all).
# Besides these, every country is a scenario of its own ("What if Brazil stopped selling?", from
# its sales page): scenario.export writes one small file per seller.
scenarios:
  black_sea:
    label: The Black Sea closes
    food: cereals
    # the countries whose grain leaves mainly through Black Sea ports (Türkiye's other coasts stay open)
    sellers: [RUS, UKR, ROU, BGR, GEO]
  cocoa:
    label: Côte d'Ivoire and Ghana stop selling cocoa
    food: stimulants
    sellers: [CIV, GHA]
  palm_oil:
    label: Indonesia and Malaysia stop selling palm oil
    food: vegetable_oils
    sellers: [IDN, MYS]
  soy:
    label: South America stops selling soy
    food: oilseeds
    sellers: [ARG, BOL, BRA, CHL, COL, ECU, GUY, PRY, PER, SUR, URY, VEN]
  fortress_europe:
    label: The world stops selling to Europe
    food: all
    sellers: outside_europe
