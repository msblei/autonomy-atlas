# Countries in scope. ISO3 is the project key.
#   m49      : UN M49 numeric code, as string (FAOSTAT "Area Code (M49)" column; strip apostrophes).
#   eurostat : Eurostat geo code (note EL for Greece, UK for United Kingdom).
#   group    : EU27 | UK | EFTA | Balkans | East | Other
#   notes    : data caveats worth surfacing in the UI.
#
# Kosovo (XKX) is deliberately absent: FAO merges it into Serbia. Show a note on the map.

