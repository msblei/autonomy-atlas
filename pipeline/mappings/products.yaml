# User-facing product groups -> FAO Food Balance Sheet item names.
#
# FBS item names are the master product key. Trade (HS6/CN8) and Eurostat crop codes are
# crosswalked *to* these items, not the other way round.
#
# Item names below are taken from the FBS (2010-) "Normalized" bulk file. Spelling matters
# ("Soyabeans", "Pigmeat", "Rape and Mustardseed"). harmonise.py logs any item in the file that is
# not listed here and any name listed here that does not appear in the file — fix the YAML, not
# the code. Items not mapped to a group are kept at item level but excluded from group totals.
#
# "weight" is used only to order the UI; it is not a numeric weight.
# "plain" is a one-line caveat shown to non-expert readers; "notes" is for the expert view.

groups:
  cereals:
    label: Cereals
    plain: Includes grain fed to animals, brewed into beer or turned into biofuel, not just bread and pasta.
    items:
      - Wheat and products
      - Rice and products
      - Barley and products
      - Maize and products
      - Rye and products
      - Oats
      - Millet and products
      - Sorghum and products
      - Cereals, other

  potatoes_roots:
    label: Potatoes & roots
    items:
      - Potatoes and products
      - Cassava and products
      - Sweet potatoes
      - Roots, Other

  sugar:
    label: Sugar & sweeteners
    items:
      - Sugar (Raw Equivalent)
      - Sweeteners, Other
      - Honey
    # Sugar beet / cane are feedstock, not food supply; keep them out of the group total.

  pulses:
    label: Pulses
    items:
      - Beans
      - Peas
      - Pulses, Other and products

  oilseeds:
    label: Oilseeds & protein crops
    plain: Much of this is soy fed to animals. Europe produces only a small part of the soy it uses.
    items:
      - Soyabeans
      - Sunflower seed
      - Rape and Mustardseed
      - Groundnuts
      - Sesame seed
      - Olives (including preserved)
      - Oilcrops, Other
    notes: >
      Soy is the key feed-dependence indicator (EU soy SSR ~15%). Phase 4 uses this group for the
      feed-adjusted livestock SSR.

  vegetable_oils:
    label: Vegetable oils
    plain: Oil pressed here from imported seeds counts as produced here.
    items:
      - Soyabean Oil
      - Sunflowerseed Oil
      - Rape and Mustard Oil
      - Olive Oil
      - Palm Oil
      - Palmkernel Oil
      - Groundnut Oil
      - Coconut Oil
      - Sesameseed Oil
      - Maize Germ Oil
      - Oilcrops Oil, Other

  vegetables:
    label: Vegetables
    items:
      - Tomatoes and products
      - Onions
      - Vegetables, other

  fruit:
    label: Fruit
    plain: Mixes fruit that grows here (apples, plums) with fruit that cannot (bananas, oranges).
    items:
      - Apples and products
      - Grapes and products (excl wine)
      - Oranges, Mandarines
      - Lemons, Limes and products
      - Grapefruit and products
      - Citrus, Other
      - Bananas
      - Plantains
      - Pineapples and products
      - Dates
      - Fruits, other
    notes: >
      Aggregating fruit hides structure: apples (high SSR in the north) vs bananas/citrus (zero).
      Always allow drill-down.

  meat:
    label: Meat
    plain: Counts every animal raised here, also those fed on imported feed (see "Feed from abroad").
    items:
      - Bovine Meat
      - Pigmeat
      - Poultry Meat
      - Mutton & Goat Meat
      - Meat, Other
      - Offals, Edible

  dairy:
    label: Dairy
    plain: Counts all milk from cows kept here, also those given imported feed (see "Feed from abroad").
    items:
      - Milk - Excluding Butter
      - Butter, Ghee
      - Cream

  eggs:
    label: Eggs
    plain: Counts all eggs laid here, also by hens fed on imported feed (see "Feed from abroad").
    items:
      - Eggs

  fish:
    label: Fish & seafood
    plain: Fish caught by the country's own boats plus fish farms.
    items:
      - Freshwater Fish
      - Demersal Fish
      - Pelagic Fish
      - Marine Fish, Other
      - Crustaceans
      - Cephalopods
      - Molluscs, Other
      - Aquatic Animals, Others

  stimulants:
    label: Coffee, cocoa, tea
    plain: These grow only in warm climates, so most countries produce almost none.
    items:
      - Coffee and products
      - Cocoa Beans and products
      - Tea (including mate)
    notes: Structurally near-zero SSR for all of Europe; useful as a sanity check.

  wine_beer:
    label: Wine & beer
    plain: Beer brewed here from imported barley counts as produced here.
    items:
      - Wine
      - Beer
