# Netlify serves the prebuilt site from web/dist: the data files are produced by the Python
# pipeline on a laptop (make release), not on Netlify, so there is no build command here.
# Deploy with `netlify deploy --prod --dir web/dist` after `make release`.
[build]
  publish = "web/dist"

# The borders are TopoJSON: served as JSON so the CDN compresses them (as octet-stream it sent all
# 437 KB uncompressed; as JSON about 160 KB).
[[headers]]
  for = "/data/*.topojson"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

# Vite names its bundles by content hash: safe to cache for a year. Everything else (index.html,
# data/*.json, fonts) keeps Netlify's default (revalidate on every request, ETag).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
